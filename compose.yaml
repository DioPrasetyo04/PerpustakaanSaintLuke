services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elibrary-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - laravel_vendor:/var/www/vendor
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: saint_luke_library
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LIBREOFFICE_BINARY: soffice
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader &&
             php artisan key:generate --force &&
             php artisan storage:link &&
             php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - saint-luke-library-network

  node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elibrary-node
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - laravel_vendor:/var/www/vendor
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      - app
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - saint-luke-library-network

  mysql:
    image: mysql:8.0
    container_name: elibrary-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saint_luke_library
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/saint_luke_library.sql:/docker-entrypoint-initdb.d/saint_luke_library.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saint-luke-library-network

  redis:
    image: redis:alpine
    container_name: elibrary-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - saint-luke-library-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: elibrary-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 300M
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - saint-luke-library-network

volumes:
  laravel_vendor:
  node_modules:
  mysql_data:
  redis_data:

networks:
  saint-luke-library-network:
    driver: bridge
