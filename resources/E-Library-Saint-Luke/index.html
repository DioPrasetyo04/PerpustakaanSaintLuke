<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Library · Yayasan Saint Luke</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          // ── Emerald + Brass (modern premium, dark-first) ──
          ink:        '#14201B',
          'ink-soft': '#243831',
          paper:      '#F2F0EA',
          'paper-2':  '#E7E4D9',
          card:       '#FFFFFF',
          // accent kept under the name "cobalt" app-wide → now EMERALD
          cobalt:     '#1F9D73',
          'cobalt-dk':'#15795A',
          'cobalt-lt':'#34C690',
          'cobalt-50':'#E6F4EE',
          // brass / gold
          brass:      '#B0822F',
          'brass-lt': '#D2A653',
          'brass-50': '#F3EAD2',
          muted:      '#6B6A60',
          'muted-2':  '#9A988B',
          line:       '#E3E0D4',
          // dark (deep emerald-black, premium)
          night:      '#0E1311',
          'night-2':  '#161E1A',
          'night-3':  '#1E2A24',
          'night-4':  '#2A3A31',
          'night-line':'#283731',
        },
        fontFamily: {
          serif: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          sans:  ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          quote: ['Fraunces', 'Georgia', 'serif'],
          mono:  ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        letterSpacing: { 'editorial': '0.14em', 'wider-2': '0.22em' },
        borderRadius: { 'xl2': '1.25rem', '4xl': '2rem' },
        boxShadow: {
          'book':      '0 1px 2px rgba(30,42,36,.06), 0 8px 18px -6px rgba(30,42,36,.16)',
          'book-3d':   '14px 18px 30px -10px rgba(30,42,36,.30), 4px 6px 14px -4px rgba(30,42,36,.14)',
          'soft':      '0 1px 3px rgba(30,42,36,.05), 0 6px 16px -6px rgba(30,42,36,.10)',
          'lift':      '0 4px 10px rgba(30,42,36,.07), 0 20px 40px -12px rgba(30,42,36,.20)',
          'glow':      '0 0 0 1px rgba(24,68,58,.14), 0 12px 32px -8px rgba(24,68,58,.28)',
        },
      }
    }
  }
</script>
<style>
  :root { color-scheme: light; }
  html.dark { color-scheme: dark; }
  body {
    font-family: '"Public Sans"', system-ui, sans-serif;
    background: #F4EEE2; color: #1E2A24;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  html.dark body { background: #0E1311; color: #ECEAE0; }
  ::selection { background: #1F9D73; color: #FFFFFF; }

  em { font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-weight: 500; }
  .font-quote em, em.quote { font-family: 'Fraunces', Georgia, serif; }

  /* hero mesh — warm pine + brass (no purple cliché) */
  .hero-mesh {
    background:
      radial-gradient(60% 50% at 14% 0%, rgba(31,157,115,.14), transparent 68%),
      radial-gradient(48% 44% at 96% 8%, rgba(176,130,47,.14), transparent 70%),
      radial-gradient(42% 42% at 82% 100%, rgba(52,198,144,.10), transparent 72%);
  }
  html.dark .hero-mesh {
    background:
      radial-gradient(60% 50% at 14% 0%, rgba(52,198,144,.18), transparent 68%),
      radial-gradient(48% 44% at 96% 8%, rgba(210,166,83,.14), transparent 70%),
      radial-gradient(42% 42% at 82% 100%, rgba(31,157,115,.16), transparent 72%);
  }

  .dot-grid { background-image: radial-gradient(rgba(30,42,36,.07) 1px, transparent 1px); background-size: 22px 22px; }
  html.dark .dot-grid { background-image: radial-gradient(rgba(240,233,218,.06) 1px, transparent 1px); }

  .line-grid {
    background-image:
      linear-gradient(rgba(30,42,36,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,42,36,.05) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  html.dark .line-grid {
    background-image:
      linear-gradient(rgba(240,233,218,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,233,218,.045) 1px, transparent 1px);
  }

  .hairline { border-color: #E3E0D4; }
  html.dark .hairline { border-color: #283731; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(30,42,36,.18); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(24,68,58,.5); border: 2px solid transparent; background-clip: content-box; }
  html.dark ::-webkit-scrollbar-thumb { background: rgba(240,233,218,.16); border: 2px solid transparent; background-clip: content-box; }

  .nav-link { position: relative; }
  .nav-link::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px;
    background: #1F9D73; transform-origin: left; transform: scaleX(0);
    transition: transform .3s cubic-bezier(.4,0,.2,1); border-radius: 2px;
  }
  html.dark .nav-link::after { background: #34C690; }
  .nav-link:hover::after, .nav-link[aria-current="page"]::after { transform: scaleX(1); }

  .drop-cap::first-letter {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 4.2em;
    float: left; line-height: .82; margin: 8px 14px 0 0; color: #1F9D73; font-style: normal;
  }
  html.dark .drop-cap::first-letter { color: #34C690; }

  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  @keyframes shimmer { 0% { background-position: -200% 0 } 100% { background-position: 200% 0 } }
  .skeleton { background: linear-gradient(90deg, rgba(30,42,36,.04) 0%, rgba(30,42,36,.10) 50%, rgba(30,42,36,.04) 100%); background-size: 200% 100%; animation: shimmer 1.6s ease-in-out infinite; }
  html.dark .skeleton { background: linear-gradient(90deg, rgba(240,233,218,.04) 0%, rgba(240,233,218,.10) 50%, rgba(240,233,218,.04) 100%); background-size: 200% 100%; }

  /* ── 3D BOOK HOVER (standalone covers) ── */
  .book-3d { perspective: 1100px; perspective-origin: 50% 50%; display: inline-block; }
  .book-3d-inner {
    position: relative; transform-style: preserve-3d; transform-origin: left center;
    transition: transform .42s cubic-bezier(.2,.7,.2,1), box-shadow .42s ease; will-change: transform;
  }
  .book-3d-inner::before {
    content: ''; position: absolute; right: -6px; top: 1.5%; width: 6px; height: 97%;
    background: linear-gradient(90deg, rgba(30,42,36,.18), rgba(30,42,36,.05));
    transform: rotateY(90deg); transform-origin: left center; opacity: 0; transition: opacity .42s ease;
  }
  .group:hover .book-3d-inner, .book-3d:hover .book-3d-inner, .book-3d:focus-within .book-3d-inner {
    transform: translate3d(10px, -5px, 22px) rotateY(-13deg) rotateX(3deg);
    box-shadow: 18px 24px 38px -10px rgba(30,42,36,.34), 6px 8px 16px -6px rgba(30,42,36,.18);
  }
  .group:hover .book-3d-inner::before, .book-3d:hover .book-3d-inner::before { opacity: 1; }
  html.dark .group:hover .book-3d-inner, html.dark .book-3d:hover .book-3d-inner { box-shadow: 18px 24px 40px -10px rgba(0,0,0,.6), 6px 8px 16px -6px rgba(0,0,0,.35); }
  html.no3d .group:hover .book-3d-inner, html.no3d .book-3d:hover .book-3d-inner { transform: translateY(-5px); box-shadow: 0 4px 8px rgba(30,42,36,.10), 0 24px 40px -12px rgba(30,42,36,.2); }
  html.no3d .group:hover .book-3d-inner::before, html.no3d .book-3d:hover .book-3d-inner::before { opacity: 0; }

  /* ── 3D BOOK MODEL (swipeable media frame) ── */
  .book3d-stage { perspective: 1300px; perspective-origin: 50% 42%; }
  .book3d-tilt {
    position: relative; transform-style: preserve-3d; transform-origin: center center;
    transition: transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s ease, filter .5s ease;
    will-change: transform;
    box-shadow: 0 1px 2px rgba(30,42,36,.08), 0 10px 22px -10px rgba(30,42,36,.20);
    border-radius: 2px 6px 6px 2px;
  }
  .book3d-face { position: relative; transform-style: preserve-3d; backface-visibility: hidden; }
  /* page block (thickness) on the right edge — hidden until hover */
  .book3d-tilt::after {
    content: ''; position: absolute; top: 3px; bottom: 3px; right: 1px; width: 15px;
    background-image: repeating-linear-gradient(90deg, #f3eedf 0, #f3eedf 1.4px, #d4cab0 1.4px, #d4cab0 2.8px);
    border-radius: 1px; transform: rotateY(74deg); transform-origin: right center;
    opacity: 0; transition: opacity .5s ease; box-shadow: inset 0 0 6px rgba(0,0,0,.18);
  }
  /* top page edge for extra depth */
  .book3d-tilt::before {
    content: ''; position: absolute; left: 3px; right: 3px; top: 1px; height: 12px;
    background-image: repeating-linear-gradient(0deg, #f3eedf 0, #f3eedf 1.4px, #d4cab0 1.4px, #d4cab0 2.8px);
    border-radius: 1px; transform: rotateX(70deg); transform-origin: top center;
    opacity: 0; transition: opacity .5s ease;
  }
  /* moving light sheen across the cover on hover */
  .book3d-sheen {
    position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 48%, transparent 64%);
    transform: translateX(-60%); transition: opacity .4s ease;
  }
  .group:hover .book3d-tilt, .book3d-stage:hover .book3d-tilt {
    transform: rotateY(-26deg) rotateX(6deg) translateZ(16px);
    box-shadow: 30px 36px 60px -18px rgba(30,42,36,.42), 10px 14px 24px -10px rgba(30,42,36,.22);
  }
  .group:hover .book3d-tilt::after, .book3d-stage:hover .book3d-tilt::after,
  .group:hover .book3d-tilt::before, .book3d-stage:hover .book3d-tilt::before { opacity: 1; }
  .group:hover .book3d-sheen { opacity: 1; animation: sheenSweep 1.1s cubic-bezier(.3,.7,.3,1) .12s; }
  @keyframes sheenSweep { 0% { transform: translateX(-60%); } 100% { transform: translateX(60%); } }
  html.dark .book3d-tilt { box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 24px -12px rgba(0,0,0,.5); }
  html.dark .group:hover .book3d-tilt, html.dark .book3d-stage:hover .book3d-tilt {
    box-shadow: 30px 36px 64px -18px rgba(0,0,0,.7), 10px 14px 24px -10px rgba(0,0,0,.45);
  }
  /* reduced-motion / no-3D fallback: simple lift */
  html.no3d .group:hover .book3d-tilt, html.no3d .book3d-stage:hover .book3d-tilt { transform: translateY(-6px); }
  html.no3d .book3d-tilt::after, html.no3d .book3d-tilt::before { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .group:hover .book3d-tilt, .book3d-stage:hover .book3d-tilt { transform: translateY(-5px); }
    .book3d-tilt::after, .book3d-tilt::before, .book3d-sheen { display: none; }
  }

  .prod-card { transition: transform .34s cubic-bezier(.2,.7,.2,1), box-shadow .34s ease, border-color .34s ease; }
  .group:hover .prod-card { transform: translateY(-6px); }

  .page-enter { opacity: 0; transform: translateY(8px); }
  .page-enter.in { opacity: 1; transform: none; transition: opacity .4s ease-out, transform .4s ease-out; }

  .dd-enter { opacity: 0; transform: translateY(-6px) scale(.98); }
  .dd-enter.in { opacity: 1; transform: none; transition: all .22s cubic-bezier(.2,.7,.2,1); }

  .tabnum { font-variant-numeric: tabular-nums; }
  *:focus-visible { outline: 2px solid #1F9D73; outline-offset: 2px; border-radius: 4px; }

  /* ── image-slot integration ── */
  image-slot { display: block; }
  /* cover slot: layered over the typographic cover — transparent until filled */
  .cover-slot::part(frame) { background: transparent; }
  .cover-slot::part(ring) { border-color: transparent; }
  .cover-slot::part(empty) { opacity: 0; transition: opacity .25s ease; color: #fff; }
  .cover-slot:hover::part(empty) { opacity: 1; }
  .cover-slot:hover::part(ring) { border-color: rgba(255,255,255,.5); }
  .cover-slot:hover::part(frame) { background: rgba(0,0,0,.32); }
  /* display-only mirror on cards — no interaction, just shows dropped image */
  .slot-display { pointer-events: none; }
  .slot-display::part(empty), .slot-display::part(ring) { display: none; }
  .slot-display::part(frame) { background: transparent; }
  /* asset slot: visible drop affordance */
  .asset-slot::part(frame) { background: rgba(31,157,115,.06); }
  .asset-slot::part(empty) { color: #1F9D73; }
  html.dark .asset-slot::part(empty) { color: #34C690; }
  html.dark .asset-slot::part(frame) { background: rgba(52,198,144,.08); }

  .spine-shadow {
    background-image:
      linear-gradient(90deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,0) 6%, rgba(0,0,0,0) 94%, rgba(0,0,0,.10) 100%),
      linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(0,0,0,0) 18%);
  }

  .section-num { font-family: 'Space Grotesk', sans-serif; color: #1F9D73; font-weight: 700; font-feature-settings: 'lnum'; }
  html.dark .section-num { color: #34C690; }

  /* marquee */
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { display: flex; width: max-content; animation: marquee 34s linear infinite; }
  .marquee-wrap:hover .marquee-track { animation-play-state: paused; }

  /* live ticker (faster) */
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ticker-track { display: flex; width: max-content; animation: ticker 48s linear infinite; }
  .ticker-wrap:hover .ticker-track { animation-play-state: paused; }

  /* accordion */
  .acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.2,.7,.2,1); }
  .acc-body.open { grid-template-rows: 1fr; }
  .acc-body > div { overflow: hidden; }

  /* float */
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .floaty { animation: floaty 6s ease-in-out infinite; }
  .floaty-2 { animation: floaty 7s ease-in-out infinite; animation-delay: -2s; }

  /* corner-bracket frame — signature detail (à la iyelstore) */
  .bracket { position: relative; }
  .bracket::before, .bracket::after {
    content: ''; position: absolute; width: 16px; height: 16px; pointer-events: none;
    border: 1.5px solid currentColor; opacity: .45; transition: all .3s ease;
  }
  .bracket::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
  .bracket::after  { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }
  .bracket:hover::before, .bracket:hover::after { opacity: .9; width: 22px; height: 22px; }

  main { min-height: 60vh; }
  .btn-press { transition: transform .12s ease; }
  .btn-press:active { transform: scale(.96); }

  /* big layered hero word */
  .hero-stroke {
    -webkit-text-stroke: 1.5px rgba(31,157,115,.30);
    color: transparent;
  }
  html.dark .hero-stroke { -webkit-text-stroke-color: rgba(52,198,144,.30); }

  /* gradient accent text (emerald → brass) */
  .grad-text {
    background: linear-gradient(110deg, #1F9D73 10%, #34C690 50%, #D2A653 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ── animated tabs underline ── */
  .tabs-rail { position: relative; }
  .tab-ink {
    position: absolute; bottom: 0; height: 2px; background: #1F9D73;
    border-radius: 2px; transition: left .32s cubic-bezier(.2,.7,.2,1), width .32s cubic-bezier(.2,.7,.2,1);
  }
  html.dark .tab-ink { background: #34C690; }
  .tab-panel { animation: tabIn .4s cubic-bezier(.2,.7,.2,1); }
  @keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ── quick-view modal ── */
  .qv-overlay { animation: qvFade .25s ease-out; }
  @keyframes qvFade { from { opacity: 0; } to { opacity: 1; } }
  .qv-panel { animation: qvPop .34s cubic-bezier(.2,.8,.2,1); }
  @keyframes qvPop { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: none; } }

  /* ── chip (filter) ── */
  .chip { transition: all .2s cubic-bezier(.2,.7,.2,1); }
  .chip:active { transform: scale(.94); }

  /* ── parallax layers (JS sets --py) ── */
  .parallax { transform: translateY(calc(var(--py, 0) * 1px)); will-change: transform; }

  /* ── cursor glow on hero ── */
  .cursor-glow {
    background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), rgba(31,157,115,.14), transparent 70%);
    transition: background .1s linear;
  }
  html.dark .cursor-glow { background: radial-gradient(240px circle at var(--mx,50%) var(--my,50%), rgba(52,198,144,.16), transparent 70%); }

  /* ── progress ring / bar ── */
  .progress-bar { transition: width 1s cubic-bezier(.2,.7,.2,1); }

  /* count chip pulse */
  @keyframes softpulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .softpulse { animation: softpulse 2s ease-in-out infinite; }

  /* shimmer sweep on premium cards */
  .sheen { position: relative; overflow: hidden; }
  .sheen::after {
    content: ''; position: absolute; inset: 0; transform: translateX(-120%);
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.14) 50%, transparent 70%);
    transition: transform .8s ease;
  }
  .group:hover .sheen::after { transform: translateX(120%); }

  @media (prefers-reduced-motion: reduce) {
    .floaty, .floaty-2, .marquee-track, .ticker-track, .softpulse { animation: none !important; }
  }

  /* dual-handle year range */
  .yr-range { height: 24px; background: transparent; }
  .yr-range::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 18px; height: 18px; border-radius: 999px; background: #fff; border: 2px solid #1F9D73; box-shadow: 0 2px 6px rgba(0,0,0,.22); cursor: pointer; margin-top: -8px; }
  .yr-range::-moz-range-thumb { pointer-events: auto; width: 16px; height: 16px; border-radius: 999px; background: #fff; border: 2px solid #1F9D73; box-shadow: 0 2px 6px rgba(0,0,0,.22); cursor: pointer; }
  .yr-range::-webkit-slider-runnable-track { height: 2px; background: transparent; }
  .yr-range::-moz-range-track { height: 2px; background: transparent; }
  html.dark .yr-range::-webkit-slider-thumb { background: #1A2820; border-color: #34C690; }
  html.dark .yr-range::-moz-range-thumb { background: #1A2820; border-color: #34C690; }
</style>
</head>
<body class="font-sans antialiased">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/motion.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/layout.jsx"></script>
  <script type="text/babel" src="src/pages-home.jsx"></script>
  <script type="text/babel" src="src/pages-catalog.jsx"></script>
  <script type="text/babel" src="src/pages-book.jsx"></script>
  <script type="text/babel" src="src/pages-authors.jsx"></script>
  <script type="text/babel" src="src/pages-resources.jsx"></script>
  <script type="text/babel" src="src/pages-about.jsx"></script>
  <script type="text/babel" src="src/pages-account.jsx"></script>
