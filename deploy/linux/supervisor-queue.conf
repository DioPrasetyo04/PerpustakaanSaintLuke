; Supervisord config untuk Laravel queue worker.
; Copy ke /etc/supervisor/conf.d/perpustakaan-queue.conf, lalu:
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start perpustakaan-queue:*
;
; Sesuaikan path project (`/var/www/...`) dan user (`www-data`) sesuai server Anda.

[program:perpustakaan-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/perpustakaan-saint-luke/artisan queue:work database --tries=3 --sleep=3 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/perpustakaan-saint-luke/storage/logs/queue-worker.log
stopwaitsecs=3600
